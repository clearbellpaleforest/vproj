name: Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    name: Syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Vim
        run: |
          sudo apt-get update
          sudo apt-get install -y vim-gtk3 2>/dev/null || \
          sudo apt-get install -y vim-nox

      - name: Check Vim9Script syntax
        run: |
          vim --version | head -n 3
          vim -N -u NONE -c 'set rtp+=src' -c 'runtime! plugin/vproj.vim' -c 'qa!' 2>&1 | tee /tmp/lint.txt
          if grep -qE 'E[0-9]+:' /tmp/lint.txt; then
            echo "Syntax errors found"
            exit 1
          fi
          echo "All files load without errors"

  tests:
    name: Test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Vim
        run: |
          sudo apt-get update
          sudo apt-get install -y vim-gtk3 2>/dev/null || \
          sudo apt-get install -y vim-nox

      # run_all.sh isolates HOME/XDG_CACHE_HOME per file and decides pass/fail
      # by Vim's exit code, so an aborted or hung test fails the job.
      - name: Run all tests
        run: |
          vim --version | head -n 3
          bash tests/run_all.sh -v
